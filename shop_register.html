<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TShoot - تسجيل محل جديد</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 400px; border-radius: 12px;">
        <h3 class="text-center mb-3 fw-bold">🛠️ TShoot</h3>
        <p class="text-center text-muted mb-4">أنشئ حساب محلك وابدأ فترة مجانية لمدة 14 يوماً</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">اسم المحل</label>
                <input type="text" name="shop_name" class="form-control" required
                    placeholder="مثال: مركز النخبة للصيانة">
            </div>
            <div class="mb-3">
                <label class="form-label">اسم صاحب المحل أو الفني</label>
                <input type="text" name="owner_name" class="form-control" required placeholder="اسمك الكريم">
            </div>
            <div class="mb-3">
                <label class="form-label">رقم الهاتف (للتسجيل والدخول)</label>
                <input type="text" name="phone" class="form-control" required placeholder="05xxxxxxxx">
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2">تسجيل وفتح الحساب</button>
        </form>
        <div class="text-center mt-3">
            <small>لديك حساب بالفعل؟ <a href="{{ url_for('shop.login') }}" class="text-decoration-none">تسجيل
                    الدخول</a></small>
        </div>
    </div>

</body>

</html>
